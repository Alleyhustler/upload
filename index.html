<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wins</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    /* Left Panel */
    .left-panel {
      background: #0a0a0a;
      border-right: 1px solid #222;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-img {
      width: 52px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      line-height: 1;
    }

    .links {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link {
      font-size: 11px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .link:hover {
      color: #8b9cf7;
    }

    .link-separator {
      font-size: 11px;
      color: #444;
    }

    .upload-section {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 20px;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .file-input-wrapper {
      border: 1px dashed #333;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .file-input-wrapper:hover {
      border-color: #555;
    }

    .file-input {
      display: none;
    }

    .file-label {
      font-size: 13px;
      color: #888;
    }

    .handle-input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .handle-input:focus {
      outline: none;
      border-color: #555;
    }

    .handle-input::placeholder {
      color: #666;
    }

    .submit-btn {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Space Grotesk', sans-serif;
    }

    .submit-btn:hover {
      background: #f0f0f0;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .submissions-list {
      flex: 1;
      overflow-y: auto;
    }

    .submissions-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .submission-item {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .submission-item:hover {
      background: #151515;
      border-color: #333;
    }

    .submission-item.selected {
      background: #1a1a1a;
      border-color: #444;
    }

    .submission-handle {
      font-size: 13px;
      color: #fff;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .submission-time {
      font-size: 11px;
      color: #666;
    }

    .admin-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      background: #667eea;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .submission-item:hover .admin-indicator {
      opacity: 1;
    }

    .admin-section {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
    }

    .admin-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .admin-toggle {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
    }

    .admin-toggle:hover {
      background: #333;
    }

    .admin-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .admin-form.active {
      display: flex;
    }

    .admin-input {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .admin-input:focus {
      outline: none;
      border-color: #555;
    }

    .admin-input::placeholder {
      color: #666;
    }

    .admin-btn {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
    }

    .admin-btn:hover {
      background: #444;
    }

    .admin-tools {
      display: none;
      gap: 8px;
      flex-direction: column;
    }

    .admin-tools.active {
      display: flex;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .admin-actions button {
      flex: 1;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Space Grotesk', sans-serif;
    }

    .admin-actions button:hover {
      background: #555;
    }

    .admin-actions button.delete {
      background: #dc2626;
    }

    .admin-actions button.delete:hover {
      background: #b91c1c;
    }

    .top-trader-section {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 16px;
      margin-top: 12px;
    }

    .top-trader-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .top-trader-handle {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* Right Panel */
    .main-content {
      padding: 24px;
      overflow-y: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .post-card {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .post-card:hover {
      border-color: #333;
    }

    .post-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .post-content {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post-handle {
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }

    .share-btn {
      background: #1da1f2;
      border: none;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }

    .share-btn:hover {
      background: #1991db;
    }

    .share-icon {
      width: 12px;
      height: 12px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #666;
      font-size: 13px;
    }

    .count {
      font-size: 11px;
      color: #666;
      margin-left: auto;
      font-weight: 500;
    }

    .status-message {
      font-size: 11px;
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      display: none;
    }

    .status-message.success {
      background: #065f46;
      color: #10b981;
      display: block;
    }

    .status-message.error {
      background: #7f1d1d;
      color: #ef4444;
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      
      .left-panel {
        padding: 16px;
        gap: 16px;
      }
      
      .main-content {
        padding: 16px;
      }
      
      .gallery {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="header-section">
<img src="W (2).png" class="logo-img" alt="Wins Logo" />
        <div class="header-text">


          <div class="subtitle">Share your trading wins</div>
          <div class="links">
            <a href="https://twitter.com/Uploadotfun" target="_blank" class="link">Twitter</a>
            <span class="link-separator">•</span>
            <a href="#" class="link">CA</a>
          </div>
        </div>
      </div>
      
      <div class="upload-section">
        <div class="upload-title">Submit</div>
        <form onsubmit="uploadWin(event)">
          <div class="file-input-wrapper" onclick="document.getElementById('imageInput').click()">
            <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="handleFileSelect(event)">
            <div class="file-label" id="fileLabel">Choose image</div>
          </div>
          <input type="text" id="handleInput" class="handle-input" placeholder="@handle" maxlength="50">
          <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        </form>
      </div>

      <div class="submissions-list">
        <div style="display: flex; align-items: center;">
          <div class="submissions-title">Submissions</div>
          <div class="count" id="postCount">0</div>
        </div>
        <div id="submissionsList"></div>
        
        <div class="admin-section">
          <div class="admin-title">Admin Panel</div>
          <button type="button" class="admin-toggle" onclick="toggleAdminForm()">Toggle Admin</button>
          
          <form class="admin-form" id="adminForm" onsubmit="loginAdmin(event)">
            <input type="password" id="adminPassword" class="admin-input" placeholder="Admin Password" required>
            <button type="submit" class="admin-btn">Login</button>
          </form>
          
          <div class="admin-tools" id="adminTools">
            <input type="text" id="topTraderHandle" class="admin-input" placeholder="Set top trader @handle">
            <button type="button" class="admin-btn" onclick="setTopTrader()">Set Top Trader</button>
            
            <div id="selectedSubmissionActions" style="display: none;">
              <div style="font-size: 11px; color: #888; margin-bottom: 6px;">Selected: <span id="selectedHandle"></span></div>
              <div class="admin-actions">
                <button onclick="deleteSubmission()">Delete</button>
                <button onclick="promoteSubmission()">Promote</button>
              </div>
            </div>
          </div>
          
          <div class="status-message" id="statusMessage"></div>
        </div>

        <div class="top-trader-section" id="topTrader">
          <div class="top-trader-title">Top Trader</div>
          <div class="top-trader-handle">Loading...</div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="gallery" id="gallery">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://ewndjtugilmfhybuwnxb.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3bmRqdHVnaWxtZmh5YnV3bnhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk1NzUxNTAsImV4cCI6MjA2NTE1MTE1MH0.d2yJCduatJ40Y0zdYFCQhlHL25_CniJrUS65M6_-pFQ';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    let selectedSubmission = null;
    let posts = [];
    let isAdmin = false;
    const ADMIN_PASSWORD = 'admin123'; // Change this to your preferred password

    function handleFileSelect(e) {
      const file = e.target.files[0];
      const label = document.getElementById('fileLabel');
      if (file) {
        label.textContent = file.name.length > 20 ? file.name.substring(0, 20) + '...' : file.name;
      } else {
        label.textContent = 'Choose image';
      }
    }

    async function uploadWin(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const file = document.getElementById('imageInput').files[0];
      const handle = document.getElementById('handleInput').value.trim();
      
      if (!file || !handle) {
        showStatus('Image and handle required', 'error');
        return;
      }

      const cleanHandle = handle.startsWith('@') ? handle : '@' + handle;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';

      try {
        const filePath = `${Date.now()}-${file.name}`;
        const { error: uploadError } = await client.storage.from('posts').upload(filePath, file);
        
        if (uploadError) throw uploadError;

        const { data: urlData } = client.storage.from('posts').getPublicUrl(filePath);
        const { error: insertError } = await client.from('posts').insert([
          { handle: cleanHandle, image_url: urlData.publicUrl }
        ]);
        
        if (insertError) throw insertError;

        document.getElementById('imageInput').value = '';
        document.getElementById('handleInput').value = '';
        document.getElementById('fileLabel').textContent = 'Choose image';
        
        await fetchPosts();
        showStatus('Upload successful!', 'success');
        
        submitBtn.textContent = 'Submit';
        submitBtn.disabled = false;

      } catch (error) {
        showStatus('Upload failed', 'error');
        submitBtn.textContent = 'Submit';
        submitBtn.disabled = false;
      }
    }

    async function fetchPosts() {
      try {
        const { data, error } = await client.from('posts').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        posts = data;
        updateGallery();
        updateSubmissionsList();
        document.getElementById('postCount').textContent = data.length;
      } catch (error) {
        document.getElementById('gallery').innerHTML = '<div class="loading">Error loading</div>';
      }
    }

    function updateGallery() {
      const gallery = document.getElementById('gallery');
      if (posts.length === 0) {
        gallery.innerHTML = '<div class="loading">No submissions yet</div>';
        return;
      }

      gallery.innerHTML = posts.map(post => {
        const tweetText = encodeURIComponent(`I just shared my $WIN on\nupload-your-win.xyz\n@Uploadotfun`);
        const tweetUrl = `https://twitter.com/intent/tweet?text=${tweetText}`;
        
        return `
          <div class="post-card">
            <img src="${post.image_url}" alt="Win" class="post-image" loading="lazy">
            <div class="post-content">
              <div class="post-handle">${post.handle}</div>
              <a href="${tweetUrl}" target="_blank" class="share-btn">
                <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                </svg>
                Share
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateSubmissionsList() {
      const list = document.getElementById('submissionsList');
      list.innerHTML = posts.map((post, index) => `
        <div class="submission-item ${selectedSubmission && selectedSubmission.id === post.id ? 'selected' : ''}" onclick="selectSubmission(${index})" data-id="${post.id}">
          <div class="submission-handle">${post.handle}</div>
          <div class="submission-time">${new Date(post.created_at).toLocaleDateString()}</div>
          <div class="admin-indicator"></div>
        </div>
      `).join('');
    }

    function selectSubmission(index) {
      document.querySelectorAll('.submission-item').forEach(item => item.classList.remove('selected'));
      document.querySelectorAll('.submission-item')[index].classList.add('selected');
      
      selectedSubmission = posts[index];
      
      if (isAdmin) {
        document.getElementById('selectedSubmissionActions').style.display = 'block';
        document.getElementById('selectedHandle').textContent = selectedSubmission.handle;
      }
    }

    function toggleAdminForm() {
      const form = document.getElementById('adminForm');
      form.classList.toggle('active');
    }

    function loginAdmin(e) {
      e.preventDefault();
      const password = document.getElementById('adminPassword').value;
      
      if (password === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('adminTools').classList.add('active');
        document.getElementById('adminForm').classList.remove('active');
        showStatus('Admin logged in', 'success');
        
        if (selectedSubmission) {
          document.getElementById('selectedSubmissionActions').style.display = 'block';
          document.getElementById('selectedHandle').textContent = selectedSubmission.handle;
        }
      } else {
        showStatus('Invalid password', 'error');
      }
      
      document.getElementById('adminPassword').value = '';
    }

    async function setTopTrader() {
      if (!isAdmin) {
        showStatus('Admin access required', 'error');
        return;
      }

      const handle = document.getElementById('topTraderHandle').value.trim();
      if (!handle) return;

      const cleanHandle = handle.startsWith('@') ? handle : '@' + handle;
      
      try {
        // Reset all top traders first
        const { error: resetError } = await client.from('posts').update({ is_top_trader: false }).neq('id', 0);
        if (resetError) throw resetError;

        // Set new top trader
        const { error } = await client.from('posts').update({ is_top_trader: true }).eq('handle', cleanHandle);
        if (error) throw error;
        
        await fetchTopTrader();
        document.getElementById('topTraderHandle').value = '';
        showStatus('Top trader updated', 'success');
      } catch (error) {
        showStatus('Update failed', 'error');
      }
    }

    async function deleteSubmission() {
      if (!isAdmin || !selectedSubmission) {
        showStatus('Admin access and selection required', 'error');
        return;
      }

      if (!confirm('Delete this submission?')) return;

      try {
        const { error } = await client.from('posts').delete().eq('id', selectedSubmission.id);
        if (error) throw error;
        
        selectedSubmission = null;
        document.getElementById('selectedSubmissionActions').style.display = 'none';
        await fetchPosts();
        showStatus('Submission deleted', 'success');
      } catch (error) {
        showStatus('Delete failed', 'error');
      }
    }

    async function promoteSubmission() {
      if (!isAdmin || !selectedSubmission) {
        showStatus('Admin access and selection required', 'error');
        return;
      }

      try {
        // Reset all top traders first
        const { error: resetError } = await client.from('posts').update({ is_top_trader: false }).neq('id', 0);
        if (resetError) throw resetError;

        // Promote selected submission
        const { error } = await client.from('posts').update({ is_top_trader: true }).eq('id', selectedSubmission.id);
        if (error) throw error;
        
        await fetchTopTrader();
        showStatus('Submission promoted to top trader', 'success');
      } catch (error) {
        showStatus('Promotion failed', 'error');
      }
    }

    async function fetchTopTrader() {
      try {
        const { data, error } = await client.from('posts').select('*').eq('is_top_trader', true).limit(1);
        const section = document.getElementById('topTrader');
        
        if (error || data.length === 0) {
          section.querySelector('.top-trader-handle').textContent = 'None';
        } else {
          section.querySelector('.top-trader-handle').textContent = data[0].handle;
        }
      } catch (error) {
        document.getElementById('topTrader').querySelector('.top-trader-handle').textContent = 'Error';
      }
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = message;
      statusEl.className = `status-message ${type}`;
      
      setTimeout(() => {
        statusEl.className = 'status-message';
      }, 3000);
    }

    // Initialize
    fetchPosts();
    fetchTopTrader();
  </script>
</body>
</html>
